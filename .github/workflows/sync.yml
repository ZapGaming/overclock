name: Sync agent

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy to Pollinations
        if: ${{ vars.POLLINATIONS_SYNC_URL != '' }}
        run: >-
          curl --fail --retry 2 --retry-delay 30
          -X POST "${{ vars.POLLINATIONS_SYNC_URL }}"
